<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>雙人情侶 2.5D 莊園大冒險</title>
  <style>
    :root {
      --bg: #f6f8ff;
      --card: #ffffff;
      --primary: #ff5d94;
      --primary-dark: #d83f74;
      --secondary: #6c5ce7;
      --green: #2ecc71;
      --gold: #f59f00;
      --text: #2d2430;
      --muted: #6f6275;
      --border: #ead9e4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
      background: radial-gradient(circle at top, #fff2f7 0%, #eef3ff 62%, #e6f7ef 100%);
      color: var(--text);
      padding-bottom: 56px;
      overflow-x: hidden;
    }
    header {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      border-bottom: 2px solid var(--border);
      padding: 10px 16px;
      position: sticky;
      top: 0;
      z-index: 30;
    }
    .top-row {
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .brand { font-weight: 900; font-size: 1.15rem; color: var(--primary-dark); }
    .acc-group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .acc-btn {
      border: 2px solid var(--border);
      background: #fff;
      padding: 5px 12px;
      border-radius: 999px;
      font-weight: 700;
      cursor: pointer;
    }
    .acc-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .hud {
      max-width: 1120px;
      margin: 8px auto 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
      gap: 8px;
    }
    .hud-box {
      background: #fff4f8;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 6px 12px;
      font-size: 0.88rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .container { max-width: 1120px; margin: 14px auto; padding: 0 14px; }

    /* 2.5D 世界地圖 */
    .world-map-card {
      background: linear-gradient(160deg, #dff6ff 0%, #e7f9e5 55%, #fff5d6 100%);
      border: 2px solid #cbe3d5;
      border-radius: 22px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 12px 28px rgba(70, 95, 120, 0.12);
    }
    .map-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .map-stage {
      perspective: 900px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      padding: 6px 2px 10px;
    }
    .loc-node {
      transform: rotateX(14deg);
      transform-style: preserve-3d;
      border-radius: 18px;
      padding: 12px 10px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      border: 2px solid rgba(255, 255, 255, 0.85);
      color: #242029;
    }
    .loc-node:hover { transform: rotateX(6deg) translateY(-5px); }
    .loc-node.selected {
      outline: 3px solid var(--primary);
      box-shadow: 0 14px 24px rgba(255, 93, 148, 0.32), 0 6px 0 rgba(0, 0, 0, 0.12);
    }
    .loc-node:not(.selected) { box-shadow: 0 6px 0 rgba(0, 0, 0, 0.12); }
    .loc-farm     { background: linear-gradient(180deg, #b8f29c, #7ed957); }
    .loc-animals  { background: linear-gradient(180deg, #ffe599, #f7c948); }
    .loc-shop     { background: linear-gradient(180deg, #ffd1e6, #ff9ec7); }
    .loc-plaza    { background: linear-gradient(180deg, #e3dcff, #b8a9ff); }
    .loc-beach    { background: linear-gradient(180deg, #b5f2ff, #6ad7f0); }
    .loc-mountain { background: linear-gradient(180deg, #e5e9f0, #b8c2d1); }
    .loc-forest   { background: linear-gradient(180deg, #9be7b0, #46b86a); }
    .loc-icon { font-size: 2rem; line-height: 1.15; }
    .loc-name { font-weight: 800; font-size: 0.95rem; margin-top: 4px; }
    .loc-sub  { font-size: 0.74rem; opacity: 0.85; }

    /* 場景面板 */
    .scene-panel {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 22px;
      padding: 18px;
      box-shadow: 0 10px 26px rgba(45, 36, 48, 0.06);
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
    }
    .scene-banner {
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 14px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      transform: perspective(700px) rotateX(6deg);
      box-shadow: 0 6px 0 rgba(0, 0, 0, 0.08);
    }
    .banner-farm     { background: linear-gradient(90deg, #dff7c8, #b6eb8c); }
    .banner-animals  { background: linear-gradient(90deg, #fff0bd, #ffd86b); }
    .banner-shop     { background: linear-gradient(90deg, #ffe3f0, #ffc2dd); }
    .banner-plaza    { background: linear-gradient(90deg, #ece8ff, #d1c7ff); }
    .banner-beach    { background: linear-gradient(90deg, #d6f7ff, #9ce9fc); }
    .banner-mountain { background: linear-gradient(90deg, #eef2f7, #d2dae6); }
    .banner-forest   { background: linear-gradient(90deg, #d7f7e0, #9be5b0); }

    /* 布置展示條 */
    .decor-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
      min-height: 34px;
      align-items: center;
    }
    .decor-badge {
      background: #fff8fb;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.82rem;
      font-weight: 700;
      animation: floatGentle 2.6s ease-in-out infinite;
    }

    /* 農場 2.5D 田壟與特效 */
    .plots-25d {
      perspective: 800px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(142px, 1fr));
      gap: 12px;
    }
    .tile-25d {
      transform: rotateX(15deg);
      border-radius: 15px;
      padding: 10px;
      min-height: 128px;
      background: linear-gradient(180deg, #f7dfb9, #e6be86);
      border: 2px solid #cfa063;
      box-shadow: 0 6px 0 #b38347;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-align: center;
      position: relative;
      transition: transform 0.2s;
    }
    .tile-25d.ripe {
      background: linear-gradient(180deg, #dffbe6, #a8ecc0);
      border-color: #54c47d;
      box-shadow: 0 6px 0 #3a9c5e;
      animation: ripePulse 1.4s ease-in-out infinite;
    }
    .tile-25d.locked {
      background: linear-gradient(180deg, #e6eaee, #cfd6dd);
      border-color: #b4bec8;
      box-shadow: 0 6px 0 #9aa5b1;
      opacity: 0.75;
    }
    .crop-sway {
      display: inline-block;
      font-size: 1.95rem;
      animation: sway 2.2s ease-in-out infinite;
    }
    .fx-pop {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--primary-dark);
      pointer-events: none;
      animation: fxRise 0.9s ease-out forwards;
      white-space: nowrap;
      z-index: 10;
    }

    /* 牧場動物特效 */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(245px, 1fr));
      gap: 14px;
    }
    .card-box {
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 13px;
      background: #fffdfe;
      box-shadow: 0 4px 0 rgba(216, 63, 116, 0.07);
      position: relative;
    }
    .animal-avatar {
      display: inline-block;
      font-size: 2rem;
      animation: hop 2s ease-in-out infinite;
      cursor: pointer;
    }
    .progress {
      height: 10px;
      background: #f2e6ee;
      border-radius: 999px;
      overflow: hidden;
      margin: 7px 0;
    }
    .progress > div {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      transition: width .25s;
    }

    /* 海邊海浪動態 */
    .ocean-stage {
      position: relative;
      height: 210px;
      border-radius: 18px;
      background: linear-gradient(180deg, #7be0ff 0%, #38bdf8 55%, #f6e2a6 56%, #ebd088 100%);
      overflow: hidden;
      border: 2px solid #7dd3fc;
      margin-bottom: 12px;
    }
    .wave-layer {
      position: absolute;
      left: -10%;
      width: 120%;
      height: 44px;
      top: 46%;
      background: rgba(255, 255, 255, 0.52);
      border-radius: 45%;
      animation: waveMove 3.4s ease-in-out infinite;
    }
    .wave-layer.w2 {
      top: 50%;
      height: 36px;
      background: rgba(255, 255, 255, 0.34);
      animation: waveMove 4.6s ease-in-out reverse infinite;
    }
    .shell-item {
      position: absolute;
      bottom: 18px;
      font-size: 1.7rem;
      cursor: pointer;
      animation: floatGentle 2.2s ease-in-out infinite;
    }

    /* 山上山泉與祈願樹動態 */
    .mountain-stage {
      position: relative;
      height: 230px;
      border-radius: 18px;
      background: linear-gradient(180deg, #cbe8ff 0%, #eaf6ff 58%, #cdeac0 59%, #9fd88b 100%);
      overflow: hidden;
      border: 2px solid #bae6fd;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 12px;
    }
    .spring-box {
      background: rgba(255, 255, 255, 0.72);
      border-radius: 16px;
      padding: 12px 16px;
      text-align: center;
      border: 1px solid #93c5fd;
    }
    .stream-flow {
      font-size: 1.6rem;
      animation: streamDrop 1.2s linear infinite;
    }
    .wish-tree-box {
      background: rgba(255, 250, 240, 0.82);
      border-radius: 16px;
      padding: 12px 16px;
      text-align: center;
      border: 1px solid #fcd34d;
      max-width: 310px;
    }
    .wish-icon {
      font-size: 2.3rem;
      display: inline-block;
      animation: sway 2.8s ease-in-out infinite;
    }
    .wish-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      justify-content: center;
      margin-top: 6px;
      max-height: 54px;
      overflow-y: auto;
    }
    .wish-chip {
      background: #ffe4ec;
      color: #b52b5c;
      font-size: 0.74rem;
      padding: 2px 7px;
      border-radius: 999px;
      font-weight: 700;
    }

    /* 森林動態與抓蟲小遊戲 */
    .forest-canopy {
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: linear-gradient(180deg, #dcfce7, #bbf7d0);
      border: 1px solid #86efac;
      border-radius: 14px;
      padding: 8px 12px;
      margin-bottom: 10px;
      font-size: 1.3rem;
    }
    .tree-sway { display: inline-block; animation: sway 3s ease-in-out infinite; }
    .arena {
      position: relative;
      height: 230px;
      border-radius: 16px;
      background: linear-gradient(180deg, #c7f2d4, #9ae3b2);
      border: 2px solid #5bc77e;
      overflow: hidden;
      user-select: none;
    }
    .bug {
      position: absolute;
      font-size: 2rem;
      cursor: pointer;
      transform: translate(-50%, -50%);
      animation: hop 0.9s ease-in-out infinite;
    }

    .btn {
      border: none;
      border-radius: 9px;
      padding: 6px 10px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.82rem;
    }
    .btn-pink { background: var(--primary); color: #fff; }
    .btn-purple { background: var(--secondary); color: #fff; }
    .btn-green { background: var(--green); color: #fff; }
    .btn-gold { background: var(--gold); color: #fff; }
    .btn-light { background: #f2ecf2; color: var(--text); }

    .logs { list-style: none; margin: 0; padding: 0; font-size: 0.85rem; }
    .logs li { padding: 6px 0; border-bottom: 1px dashed #f0dce7; color: var(--muted); }
    select, input[type="text"] {
      padding: 5px 8px;
      border-radius: 8px;
      border: 1px solid #d8c6d2;
    }

    #toast { position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%) translateY(20px); background: #2d2430; color: #fff; padding: 8px 18px; border-radius: 999px; opacity: 0; transition: .25s; z-index: 99; pointer-events: none; font-size: .88rem; }
    #toast.show { opacity: 1; transform: translateX(-50%); }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .shell-item.on-cd { opacity: .3; filter: grayscale(1); }
    .slot-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .slot { width: 54px; height: 54px; border: 2px dashed #e3b7cd; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #cf9ab5; font-size: 1.3rem; background: #fff8fb; }
    .smoke { animation: floatGentle 2s ease-in-out infinite; }
    .wm-scroll { padding-bottom: 4px; }
    @media (max-width: 640px) { .wm { aspect-ratio: 4 / 3; } }
    .wm { position: relative; width: 100%; max-width: 820px; margin: 0 auto; aspect-ratio: 16 / 10; border-radius: 18px; overflow: hidden; border: 2px solid #8ecfa8; box-shadow: 0 8px 20px rgba(60,100,80,.18); }
    .wm-bg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .wm-node { position: absolute; transform: translate(-50%, -50%); text-align: center; cursor: pointer; transition: transform .2s; z-index: 2; }
    .wm-node:hover { transform: translate(-50%, -56%); }
    .wm-badge { width: clamp(30px, 7.6vw, 58px); height: clamp(30px, 7.6vw, 58px); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: clamp(1rem, 4.4vw, 1.9rem); border: 2px solid #fff; box-shadow: 0 5px 0 rgba(0,0,0,.18); margin: 0 auto; }
    .wm-label { margin-top: 5px; background: rgba(255,255,255,.93); border-radius: 999px; padding: 0 clamp(4px,1.6vw,9px); font-size: clamp(.56rem, 2.3vw, .78rem); font-weight: 800; white-space: nowrap; box-shadow: 0 2px 0 rgba(0,0,0,.1); }
    .wm-node.selected .wm-badge { outline: 4px solid var(--primary); animation: hop 1.4s ease-in-out infinite; }
    .wm-node.locked { filter: grayscale(.9); opacity: .85; }
    .wm-pin { position: absolute; z-index: 4; font-size: clamp(1rem, 4vw, 1.7rem); transition: left .7s ease, top .7s ease; transform: translate(clamp(10px,3vw,18px), calc(-1 * clamp(24px,6vw,50px))); pointer-events: none; filter: drop-shadow(0 3px 2px rgba(0,0,0,.3)); }
    .wm-compass { position: absolute; top: 6px; left: 50%; transform: translateX(-50%); z-index: 3; background: rgba(255,255,255,.8); border-radius: 999px; padding: 1px 10px; font-size: .75rem; font-weight: 800; }
    .wm-cloud { animation: floatGentle 5s ease-in-out infinite; }
    .town-b:hover { filter: brightness(1.07); }
    .banner-park { background: linear-gradient(90deg, #ffe0f0, #ffc2dd); }
    .overlay { position: fixed; inset: 0; background: rgba(45,36,48,.55); display: none; align-items: center; justify-content: center; z-index: 200; padding: 12px; }
    .overlay.show { display: flex; }
    .modal-card { background: #fff; border-radius: 22px; padding: 20px 18px; width: 100%; max-width: 560px; max-height: 88vh; overflow: auto; position: relative; box-shadow: 0 20px 50px rgba(0,0,0,.3); }
    .modal-x { position: absolute; top: 8px; right: 10px; border: none; background: #f2ecf2; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; font-weight: 900; }
    .id-btn { display: block; width: 100%; margin: 10px 0; padding: 16px; border-radius: 16px; border: 3px solid var(--border); background: #fff; font-size: 1.15rem; font-weight: 900; cursor: pointer; }
    .id-btn:hover, .id-btn.last { border-color: var(--primary); background: #fff0f6; }
    .heart-bar { max-width: 1120px; margin: 14px auto 0; padding: 0 14px; }
    .hb { background: linear-gradient(90deg, #fff0f6, #ffe3ef); border: 2px solid #ffc2dd; border-radius: 16px; padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
    .opt-btn { display: block; width: 100%; text-align: left; margin: 6px 0; padding: 10px 12px; border-radius: 12px; border: 2px solid var(--border); background: #fff; font-weight: 700; cursor: pointer; font-size: .95rem; }
    .opt-btn:hover { border-color: var(--primary); }
    .mem-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; max-width: 340px; margin: 8px auto; }
    .mem-card { aspect-ratio: 1; font-size: 1.6rem; border-radius: 12px; border: 2px solid #ead9e4; background: #fff4f8; cursor: pointer; }
    .mem-card.open { background: #fff; border-color: var(--primary); }
    .mem-card.done { background: #dffbe6; border-color: #54c47d; }
    .cdx-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
    .cdx-item { text-align: center; border: 1px solid var(--border); border-radius: 12px; padding: 8px 4px; font-size: .76rem; background: #fffdfe; }
    .cdx-item.lock { opacity: .5; filter: grayscale(1); }
    .cdx-item .ic { font-size: 1.7rem; }
    .tabs-row { display: flex; flex-wrap: wrap; gap: 5px; margin: 8px 0; }
    .tab-btn { border: 2px solid var(--border); background: #fff; border-radius: 999px; padding: 3px 10px; font-size: .76rem; font-weight: 800; cursor: pointer; }
    .tab-btn.on { background: var(--primary); color: #fff; border-color: var(--primary); }
    body { font-family: inherit; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes sway {
      0%, 100% { transform: rotate(-4deg); }
      50% { transform: rotate(4deg); }
    }
    @keyframes hop {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    @keyframes floatGentle {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    @keyframes ripePulse {
      0%, 100% { transform: rotateX(15deg) scale(1); }
      50% { transform: rotateX(15deg) scale(1.03); }
    }
    @keyframes waveMove {
      0%, 100% { transform: translateX(-3%) rotate(-1deg); }
      50% { transform: translateX(3%) rotate(1deg); }
    }
    @keyframes streamDrop {
      0% { transform: translateY(-4px); opacity: 0.6; }
      50% { opacity: 1; }
      100% { transform: translateY(6px); opacity: 0.6; }
    }
    @keyframes fxRise {
      0% { opacity: 1; transform: translate(-50%, 0); }
      100% { opacity: 0; transform: translate(-50%, -26px); }
    }
  </style>
</head>
<body>
  <div class="overlay show" id="idModal">
    <div class="modal-card" style="text-align:center;max-width:420px;">
      <div style="font-size:2.4rem;">💞</div>
      <h2 style="margin:6px 0;">歡迎來到情侶莊園</h2>
      <p style="color:var(--muted);margin:0 0 8px;">請選擇你的身分，選好後就會進入遊戲</p>
      <button class="id-btn" id="idBtn1" onclick="chooseActor('player_1')">🧑 Terence</button>
      <button class="id-btn" id="idBtn2" onclick="chooseActor('player_2')">👩 Namwan</button>
      <div data-notr="1" style="margin-top:8px;display:inline-flex;gap:4px;">
        <button class="acc-btn lang-btn" data-lang="zh" onclick="setLang('zh')">中文</button>
        <button class="acc-btn lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
        <button class="acc-btn lang-btn" data-lang="th" onclick="setLang('th')">ไทย</button>
      </div>
    </div>
  </div>
  <div class="overlay" id="modal" onclick="if(event.target===this)closeModal()"><div class="modal-card"><button class="modal-x" onclick="closeModal()">✕</button><div id="modalBody"></div></div></div>
  <header>
    <div class="top-row">
      <div class="brand">🗺️ Terence &amp; Namwan 2.5D 情侶世界 <span id="syncStatus" style="font-size:0.78rem;color:#7a6c7a;">☁️ 準備中</span></div>
      <div class="acc-group">
        <button class="acc-btn" onclick="openCodex()">📖 圖鑑</button>
        <button class="acc-btn" id="soundBtn" onclick="toggleSound()">🔊 音效開</button>
        <span class="acc-btn active" id="whoLabel" style="cursor:default;">🧑 Terence</span>
        <span data-notr="1" style="display:inline-flex;gap:4px;">
          <button class="acc-btn lang-btn active" data-lang="zh" onclick="setLang('zh')">中文</button>
          <button class="acc-btn lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
          <button class="acc-btn lang-btn" data-lang="th" onclick="setLang('th')">ไทย</button>
        </span>
      </div>
    </div>
    <div class="hud" id="hud"></div>
  </header>

  <div class="container">
    <section class="heart-bar" id="heartBar" style="padding:0;margin:0 0 12px;"></section>
    <!-- 2.5D 世界地圖 -->
    <section class="world-map-card">
      <div class="map-header">
        <strong>🧭 莊園世界地圖（點擊地點前往，小人會走過去）</strong>
        <span style="font-size:0.84rem;color:#4f6356;">目前位置：<strong id="currentLocLabel">🌱 農場</strong></span>
      </div>
      <div class="wm-scroll"><div class="wm" id="worldMap"></div></div>

    const SoundFX = (() => {
      let ctx = null;
      let enabled = localStorage.getItem('couple_25d_sound') !== 'off';

      function ensureCtx() {
        if (!ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) ctx = new AC();
        }
        if (ctx && ctx.state === 'suspended') {
          ctx.resume().catch(() => {});
        }
        return ctx;
      }

      function tone(freq, type, dur, vol = 0.08, delay = 0, endFreq = null) {
        if (!enabled) return;
        const ac = ensureCtx();
        if (!ac) return;
        const now = ac.currentTime + delay;
        const osc = ac.createOscillator();
        const gain = ac.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, now + dur);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.linearRampToValueAtTime(vol, now + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
        osc.connect(gain);
        gain.connect(ac.destination);
        osc.start(now);
        osc.stop(now + dur + 0.02);
      }

    function cdLeft(spot) {
      const u = curUser();
      const t = (u.cd || {})[spot] || 0;

    function checkSpot(spot) {
      const u = curUser();
      const cfg = SPOTS[spot];
      regenStamina(u);
      const left = cdLeft(spot);
      if (left > 0) { toast(`⏳ 還在冷卻中，再等 ${left} 秒`); return false; }
      if (u.stamina < cfg.stamina) { toast(`⚡ 體力不足！需要 ${cfg.stamina}，目前 ${u.stamina}。到商店買體力道具或稍作休息吧`); return false; }
      if (u.stamina >= maxStamina(u)) u.staminaAt = Date.now();
      u.stamina -= cfg.stamina;
      u.cd[spot] = Date.now() + cfg.cd * 1000;
      renderHud();
      return true;
    }

    function addExp(exp, msg) {
      state.couple.loveExp += exp;
      const old = state.couple.loveLevel || 1;
      const lv = levelFromExp(state.couple.loveExp);
      if (lv > old) {
        state.couple.loveLevel = lv;
        state.couple.unlockedPlots = Math.max(state.couple.unlockedPlots || 6, plotsForLevel(lv));
        const un = [];
        for (let L = old + 1; L <= lv && un.length < 8; L++) (getUnlocks()[L] || []).forEach(t => un.push(t));
        pushLog(`🎉 愛情升級至 Lv.${lv}！` + (un.length ? `解鎖：${un.slice(0, 8).join('、')}` : '繼續加油！'));
        toast(`🎉 愛情等級 Lv.${lv}！` + (un.length ? ` 解鎖 ${un[0]}${un.length > 1 ? ' 等' : ''}` : ''));

    function mergeServerState(data) {
      if (!data || typeof data !== 'object') return false;
      if (Array.isArray(data.users) && data.users.length) {
        const old = state.users;
        state.users = data.users.map(su => {
          const lo = old.find(o => o.accountId === su.accountId) || {};
          return normalizeUser({ stamina: lo.stamina, staminaAt: lo.staminaAt, bonus: lo.bonus, cd: lo.cd, ...su });
        });
      }
      if (Array.isArray(data.cottageDecor)) state.cottageDecor = data.cottageDecor;
      if (Array.isArray(data.notes)) state.notes = unionNotes(state.notes, data.notes);
      if (data.heart && typeof data.heart === 'object') state.heart = mergeHeart(state.heart, data.heart);
      if (data.codex && typeof data.codex === 'object') state.codex = mergeCodex(state.codex, data.codex);
      if (data.couple && typeof data.couple === 'object') state.couple = { ...state.couple, ...data.couple };
      if (Array.isArray(data.plots) && data.plots.length) state.plots = data.plots;
      ensurePlots();
      if (Array.isArray(data.animals)) state.animals = data.animals;
      if (Array.isArray(data.buildings) && data.buildings.length) {
        state.buildings = data.buildings.map(b => ({ level: 1, ...b }));
        ensureCottage();
      }
      if (Array.isArray(data.decorations) && data.decorations.length) state.decorations = data.decorations;
      if (Array.isArray(data.wishes) && data.wishes.length) state.wishes = data.wishes;
      if (Array.isArray(data.logs) && data.logs.length) state.logs = data.logs;
      syncLevelDerived();
      return true;
    }

    /* 第一步：先將本機資料上傳至 GAS */
    async function uploadLocalState() {
      try {
        await fetch(gasUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'uploadState',
            actor,
            state
          })
        });
      } catch (err) {
        // 若遇到重新導向或網路限制，改以 GET 參數嘗試上傳
        try {
          const fallbackUrl = new URL(gasUrl);
          fallbackUrl.searchParams.set('action', 'uploadState');
          fallbackUrl.searchParams.set('actor', actor);
          fallbackUrl.searchParams.set('payload', JSON.stringify(state));
          fallbackUrl.searchParams.set('_t', Date.now());
          await fetch(fallbackUrl.toString(), { cache: 'no-store' });
        } catch (_) {}
      }
    }

    /* 第二步：向 GAS 下載最新狀態 */
    async function downloadRemoteState(rev) {
      const url = new URL(gasUrl);
      url.searchParams.set('action', 'getState');
      url.searchParams.set('actor', actor);
      url.searchParams.set('_t', Date.now());
      const res = await fetch(url.toString(), { cache: 'no-store' });
      const data = await res.json();
      if (rev !== undefined && localRev !== rev) return null; // 下載期間本機又有操作，丟棄這份舊資料
      if (mergeServerState(data)) {
        const t = new Date().toTimeString().slice(0, 8);
        document.getElementById('syncStatus').textContent = `☁️ 已同步 ${t}`;
      } else {
        document.getElementById('syncStatus').textContent = '📴 本機體驗';
      }
      return data;
    }

    /* 同步：合併短時間內的多次操作、同一時間只跑一次，且「本機有新操作時不套用舊的下載資料」，避免進度回朔 */
    let localRev = 0, uploadedRev = 0, syncRunning = false, syncAgain = false, syncTimer = null, syncWaiters = [];
    function syncWithUploadFirst(shouldUpload = true) {
      if (shouldUpload) localRev++;
      return new Promise(resolve => {
        syncWaiters.push(resolve);
        if (!syncTimer) syncTimer = setTimeout(() => { syncTimer = null; runSync(); }, shouldUpload ? 800 : 0);
      });
    }
    async function runSync() {
      if (syncRunning) { syncAgain = true; return; }
      syncRunning = true;
      try {
        do {
          syncAgain = false;
          const rev = localRev;
          if (uploadedRev !== rev) { await uploadLocalState(); uploadedRev = rev; }
          if (localRev === rev) await downloadRemoteState(rev);
          else syncAgain = true;
        } while (syncAgain);
      } catch (err) {
        document.getElementById('syncStatus').textContent = '📴 本機體驗';
      } finally {
        syncRunning = false;
        const ws = syncWaiters; syncWaiters = [];
        ws.forEach(r => r(null));
      }
    }

    /* 10 級建築升等 */
    async function investBld(bldId) {
      const u = curUser();
      const b = state.buildings.find(x => x.id === bldId);
      if (!b) return;
      const curLv = b.level || 1;
      if (curLv >= 10) return alert('這座建築已達最高 Lv.10 夢幻型態！');
      if ((state.couple.loveLevel || 1) < curLv * 2) return toast(`🔒 需要愛情等級 Lv.${curLv * 2} 才能升級`);

      const wAdd = Math.min(2, state.couple.wood, b.woodNeed - b.woodDonated);
      const cAdd = Math.min(150, u.coins, b.coinsNeed - b.coinsDonated);
      if (wAdd === 0 && cAdd === 0) return alert('沒有可投入的木材或金幣！');

      SoundFX.harvest();
      state.couple.wood -= wAdd;
      u.coins -= cAdd;
      b.woodDonated += wAdd;
      b.coinsDonated += cAdd;
      if (b.woodDonated >= b.woodNeed && b.coinsDonated >= b.coinsNeed) {
        b.level = Math.min(10, curLv + 1);
        b.woodDonated = 0;
        b.coinsDonated = 0;
        b.woodNeed = Math.round(b.woodNeed * 1.25);
        b.coinsNeed = Math.round(b.coinsNeed * 1.25);
        b.status = b.level >= 10 ? 'max_level' : 'building';
        addExp(120, `🏰「${b.name}」升至 Lv.${b.level}，外觀全面升級！`);
      } else {
        addExp(wAdd * 15 + Math.floor(cAdd / 20), `${u.nickname} 投入建材建造「${b.name}」`);
      }
      render();
      await syncWithUploadFirst(true);
      render();
    }

    /* 海邊 / 山上 / 森林 探索 */
    async function exploreSpot(spot) {
      if (!checkSpot(spot)) return;
      const u = curUser();
      const cost = SPOTS[spot].stamina;
      if (spot === 'beach') {
        SoundFX.wave();
        SoundFX.coin();
        u.coins += 65;
        addExp(25, `${u.nickname} 在海邊聽海浪撿到貝殼（+65 金幣，-${cost} 體力）`);
      } else if (spot === 'mountain') {
        SoundFX.spring();
        u.coins += 80;
        addExp(35, `${u.nickname} 在山上採集山泉水（+80 金幣，-${cost} 體力）`);
      } else if (spot === 'forest') {
        SoundFX.bird();
        state.couple.wood += 2;
        addExp(20, `${u.nickname} 在森林聽鳥叫砍伐了 2 單位木材（-${cost} 體力）`);
      }
      const fd = pickFind(spot);
      if (fd) {
        const first = codexAdd('finds', fd.id);
        toast(`🎁 獲得 ${fd.icon}${fd.name}${first ? '（新發現！）' : ''}`);
        if (first) addExp(15, `📖 圖鑑新發現：${fd.icon}${fd.name}`);
      }
      render();
      await syncWithUploadFirst(true);
      render();
    }

    async function addWish() {
      const inp = document.getElementById('wishInput');
      const txt = inp ? inp.value.trim() : '';
      if (!txt) return;
      SoundFX.wish();
      const u = curUser();
      state.wishes.unshift(`${txt}（${u.nickname}）`);
      state.wishes = state.wishes.slice(0, 8);
      addExp(30, `${u.nickname} 在祈願樹掛上願望：「${txt}」`);
      inp.value = '';
      render();
      await syncWithUploadFirst(true);
      render();
    }

    /* 森林小遊戲：抓蟲大作戰 */
    let gTimer = null, sTimer = null, gScore = 0, gLeft = 0;
    function startBugGame() {
      if (gTimer) return;
      if (!checkSpot('bug')) return;
      SoundFX.bird();
      const arena = document.getElementById('arena');
      arena.innerHTML = '';
      gScore = 0; gLeft = 15;
      document.getElementById('gScore').textContent = gScore;
      document.getElementById('gLeft').textContent = gLeft;
      updateCdUI();

      sTimer = setInterval(() => {
        const el = document.createElement('div');
        el.className = 'bug';
        el.textContent = Math.random() > 0.35 ? '🪲' : '🐦';
        el.style.left = (12 + Math.random() * 76) + '%';
        el.style.top = (15 + Math.random() * 70) + '%';
        el.onclick = () => {
          SoundFX.coin();
          gScore += 1;
          document.getElementById('gScore').textContent = gScore;
          el.remove();
        };
        arena.appendChild(el);
        setTimeout(() => el.remove(), 1400);
      }, 550);

      gTimer = setInterval(async () => {
        gLeft -= 1;
        document.getElementById('gLeft').textContent = gLeft;
        if (gLeft <= 0) {
          clearInterval(gTimer); clearInterval(sTimer);
          gTimer = null; sTimer = null;
          arena.innerHTML = '';
          const u = curUser();
          SoundFX.harvest();
          u.coins += gScore * 5;
          addExp(gScore * 4, `${u.nickname} 森林抓蟲獲得 ${gScore} 分（+${gScore * 5} 金幣）`);
          render();
          await syncWithUploadFirst(true);
          render();
          alert(`抓蟲結束！得分 ${gScore} 分！`);
        }
      }, 1000);
    }

    let decorFilter = 'all';
    function setDecorFilter(f) { decorFilter = f; render(); }
    function shopDecorList() {
      let list = DECOR_CATALOG.slice();
      if (decorFilter === 'owned') list = list.filter(d => state.decorations.includes(d.id));
      else if (decorFilter === 'unowned') list = list.filter(d => !state.decorations.includes(d.id));
      else if (decorFilter !== 'all') list = list.filter(d => d.area === decorFilter);
      return list.sort((a, b) => a.price - b.price);
    }
    function decorFilterBar() {
      const tabs = [['all','全部'],['farm','🌱 農場'],['animals','🐾 牧場'],['building','🏛️ 建築'],['unowned','未擁有'],['owned','已擁有']];
      const own = DECOR_CATALOG.filter(d => state.decorations.includes(d.id)).length;
      return `<div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px;">` + tabs.map(([k, l]) =>
        `<button class="btn ${decorFilter === k ? 'btn-pink' : 'btn-light'}" onclick="setDecorFilter('${k}')">${l}</button>`).join('') +
        `<span style="font-size:0.8rem;color:var(--muted);">收藏 ${own} / ${DECOR_CATALOG.length}</span></div>`;
    }

    function renderDecorStrip(area) {
      const owned = DECOR_CATALOG.filter(d => d.area === area && state.decorations.includes(d.id));
      if (!owned.length) return `<div class="decor-strip"><span style="font-size:0.8rem;color:var(--muted);">尚未布置此區域，可到「商店」購買裝飾！</span></div>`;
      return `<div class="decor-strip">` + owned.map(d => `<span class="decor-badge">${d.name}</span>`).join('') + `</div>`;
    }

    function render() { renderCore(); translateDom(document.body); }
    function renderCore() {
      const u = curUser();
      const partner = state.users.find(x => x.accountId !== actor) || state.users[1];
      const lv = state.couple.loveLevel;

      document.getElementById('soundBtn').textContent = SoundFX.isEnabled() ? '🔊 音效開' : '🔇 音效靜音';
      renderHud();

      const meta = LOC_META[currentLoc];
      let bodyHtml = `
        <div class="scene-banner ${meta.bannerClass}">
          <div>
            <h3 style="margin:0;">${meta.label}</h3>
            <div style="font-size:0.86rem;">${meta.desc}</div>
          </div>
          <div id="sceneControls"></div>
        </div>
      `;

      if (currentLoc === 'farm') {
        bodyHtml += renderDecorStrip('farm');
        const now = Date.now();
        bodyHtml += `<div class="plots-25d">` + state.plots.map((p, i) => {
          if (i >= state.couple.unlockedPlots + 3) return '';
          if (i >= state.couple.unlockedPlots) {
            return `<div class="tile-25d locked" data-plot="${p.plotId}"><div>🔒</div><div style="font-size:0.78rem;">Lv.${plotUnlockLv(i)} 解鎖</div></div>`;
          }
          const ownerTag = p.ownerId === 'player_1' ? 'Terence' : 'Namwan';
          if (p.status === 'empty' || !p.cropType) {
            return `<div class="tile-25d" data-plot="${p.plotId}"><div style="font-size:0.74rem;">${p.plotId}·${ownerTag}</div><div style="font-size:1.8rem;">🟫</div><button class="btn btn-pink" onclick="plantPlot('${p.plotId}')">播種</button></div>`;
          }
          const cfg = CROPS[p.cropType] || CROPS.carrot;
          const elapsed = (now - Number(p.plantTime || now)) / 1000;
          const ripe = elapsed >= cfg.sec;
          const rem = Math.max(0, Math.ceil(cfg.sec - elapsed));
          return `<div class="tile-25d ${ripe ? 'ripe' : ''}" data-plot="${p.plotId}">
            <div style="font-size:0.74rem;">${p.plotId}·${ownerTag}</div>
            <div class="crop-sway">${ripe ? cfg.icon : '🌱'}</div>
            <div style="font-size:0.76rem;">${ripe ? '可收成！' : `${rem}s·💧${p.waterCount}`}</div>
            ${ripe
              ? `<button class="btn btn-green" onclick="harvestPlot('${p.plotId}')">收成</button>`
              : `<button class="btn btn-purple" onclick="waterPlot('${p.plotId}')">澆水</button>`}
          </div>`;
        }).join('') + `</div>`;
      } else if (currentLoc === 'animals') {
        bodyHtml += renderDecorStrip('animals');
        bodyHtml += `<div class="cards-grid">` + state.animals.map(a => {
          const cfg = ANIMALS[a.species] || ANIMALS.chicken;
          return `<div class="card-box">
            <div style="display:flex;align-items:center;gap:8px;">
              <span class="animal-avatar" onclick="interactAnimal('${a.uid}','pet')">${cfg.icon}</span>
              <div>
                <strong>${a.petName}</strong>
                <div style="font-size:0.78rem;color:var(--muted);">(${cfg.name} · 點擊動物可撫摸)</div>
              </div>
            </div>
            <div style="font-size:0.84rem;margin:8px 0;">🍖 飽食 ${a.hunger}% · 💕 親密 ${a.affection}%</div>
            <div style="display:flex;gap:6px;flex-wrap:wrap;">
              <button class="btn btn-light" onclick="interactAnimal('${a.uid}','feed')">餵食</button>
              <button class="btn btn-light" onclick="interactAnimal('${a.uid}','pet')">撫摸</button>
              ${a.readyProduce ? `<button class="btn btn-green" onclick="interactAnimal('${a.uid}','collect')">收成 ${cfg.prod}</button>` : ''}
            </div>
          </div>`;
        }).join('') + `</div>`;
      } else if (currentLoc === 'shop') {
        bodyHtml += `
          <div class="cards-grid" style="margin-bottom:14px;">
            <div class="card-box"><h4>🪵 建造木材（50幣）</h4><p style="font-size:0.82rem;color:var(--muted);">升等建築與伐木必備。</p><button class="btn btn-green" onclick="buyShop('wood',1)">買 +1</button> <button class="btn btn-green" onclick="buyShop('wood',5)">買 +5</button></div>
            <div class="card-box"><h4>🌾 牧場飼料（25幣）</h4><p style="font-size:0.82rem;color:var(--muted);">餵食動物產出物資。</p><button class="btn btn-green" onclick="buyShop('feed',2)">買 +2</button> <button class="btn btn-green" onclick="buyShop('feed',10)">買 +10</button></div>
            <div class="card-box"><h4>💌 甜蜜金幣禮包（100幣）</h4><p style="font-size:0.82rem;color:var(--muted);">送 100 金幣給另一半。</p><button class="btn btn-pink" onclick="buyShop('coinGift',1)">送給另一半</button></div>
          </div>
          ${staminaShopHtml()}
          <strong style="display:block;margin-bottom:8px;">🎨 莊園布置（農場／牧場／建築）</strong>
          ${decorFilterBar()}
          <div class="cards-grid">` + shopDecorList().map(d => {
            const owned = state.decorations.includes(d.id);
            const areaTag = d.area === 'farm' ? '🌱 農場' : (d.area === 'animals' ? '🐾 牧場' : '🏛️ 建築');
            return `<div class="card-box">
              <div style="font-size:0.76rem;color:var(--secondary);font-weight:700;">${areaTag}</div>
              <h4 style="margin:4px 0;">${d.name}</h4>
              <div style="font-size:0.82rem;color:var(--muted);margin-bottom:8px;">價格：${d.price} 金幣・需愛情 Lv.${d.lv}</div>
              ${owned
                ? `<span style="font-size:0.82rem;color:var(--green);font-weight:700;">✅ 已擁有並布置</span>`
                : ((state.couple.loveLevel || 1) >= d.lv ? `<button class="btn btn-gold" onclick="buyDecor('${d.id}')">購買布置</button>` : `<span style="font-size:0.82rem;color:#b45309;font-weight:700;">🔒 愛情 Lv.${d.lv} 解鎖</span>`)}
            </div>`;
          }).join('') + `</div>`;
      } else if (currentLoc === 'plaza') {
        bodyHtml += renderPlazaTown();
      } else if (currentLoc === 'park') {
        bodyHtml += renderPark();
      } else if (currentLoc === 'beach') {
        bodyHtml += `
          <div class="ocean-stage">
            <div style="position:absolute;top:12px;right:18px;font-size:2.1rem;">☀️</div>
            <div class="wave-layer"></div>
            <div class="wave-layer w2"></div>
            <div class="shell-item" data-spot="beach" style="left:18%;" onclick="exploreSpot('beach')">🐚</div>
            <div class="shell-item" data-spot="beach" style="left:48%;animation-delay:.5s;" onclick="exploreSpot('beach')">⭐</div>
            <div class="shell-item" data-spot="beach" style="left:76%;animation-delay:1s;" onclick="exploreSpot('beach')">🐚</div>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn btn-pink" data-spot="beach" onclick="exploreSpot('beach')">撿貝殼約會</button>
            <button class="btn btn-light" onclick="SoundFX.wave()">🌊 聽海浪聲</button>
          </div>
        `;
      } else if (currentLoc === 'mountain') {
        bodyHtml += `
          <div class="mountain-stage">
            <div class="spring-box">
              <div style="font-size:1.7rem;">⛰️💧</div>
              <div class="stream-flow">💦 🌊 💦</div>
              <div style="font-size:0.82rem;font-weight:700;">高山清澈山泉</div>
              <div style="display:flex;gap:6px;justify-content:center;margin-top:8px;">
                <button class="btn btn-purple" data-spot="mountain" onclick="exploreSpot('mountain')">採山泉</button>
                <button class="btn btn-light" onclick="SoundFX.spring()">🔊 山泉聲</button>
              </div>
            </div>
            <div class="wish-tree-box">
              <div class="wish-icon">🎋🌳</div>
              <div style="font-size:0.84rem;font-weight:800;">雙人愛情祈願樹</div>
              <div style="display:flex;gap:4px;margin-top:6px;">
                <input type="text" id="wishInput" placeholder="寫下心願..." style="flex:1;min-width:90px;" />
                <button class="btn btn-pink" onclick="addWish()">許願</button>
              </div>
              <div class="wish-tags">` + state.wishes.map(w => `<span class="wish-chip">🎀 ${w}</span>`).join('') + `</div>
            </div>
          </div>
        `;
      } else if (currentLoc === 'forest') {
        bodyHtml += `
          <div class="forest-canopy">
            <span class="tree-sway">🌲</span>
            <span class="tree-sway" style="animation-delay:.4s;">🐦</span>
            <span class="tree-sway" style="animation-delay:.8s;">🌳</span>
            <span class="tree-sway" style="animation-delay:1.2s;">🦜</span>
            <span class="tree-sway" style="animation-delay:1.6s;">🌲</span>
          </div>
          <div style="margin-bottom:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;">
            <button class="btn btn-green" data-spot="forest" onclick="exploreSpot('forest')">伐木收集</button>
            <button class="btn btn-light" onclick="SoundFX.bird()">🐦 聽鳥叫</button>
            <button class="btn btn-pink" data-spot="bug" onclick="startBugGame()">開始抓蟲小遊戲（15s）</button>
            <span style="font-size:0.85rem;">得分：<strong id="gScore">0</strong> · 剩餘：<strong id="gLeft">15</strong>s</span>
          </div>
          <div class="arena" id="arena"></div>
        `;
      }

      document.getElementById('scenePanel').innerHTML = bodyHtml;

      const ctrl = document.getElementById('sceneControls');
      if (currentLoc === 'farm' && ctrl) {
        ctrl.innerHTML = `<select id="seedSel" onchange="selectedSeed=this.value">` + Object.entries(CROPS).map(([k, c]) => {
          const locked = lv < c.lv;
          return `<option value="${k}" ${locked ? 'disabled' : ''} ${selectedSeed === k ? 'selected' : ''}>${c.icon} ${c.name} (${c.cost}幣·Lv.${c.lv}${locked ? ' 🔒' : ''})</option>`;
        }).join('') + `</select>`;
      } else if (currentLoc === 'animals' && ctrl) {
        ctrl.innerHTML = `<div style="display:flex;gap:6px;flex-wrap:wrap;">
          <select id="aniSel" onchange="selectedAni=this.value">` + Object.entries(ANIMALS).map(([k, a]) => {
            const locked = lv < a.lv;
            return `<option value="${k}" ${locked ? 'disabled' : ''} ${selectedAni === k ? 'selected' : ''}>${a.icon} ${a.name} (${a.price}幣·Lv.${a.lv}${locked ? ' 🔒' : ''})</option>`;
          }).join('') + `</select>
          <input type="text" id="petName" placeholder="動物名字" style="width:110px;" value="${petDraft.replace(/\"/g, '&quot;')}" oninput="petDraft=this.value" />
          <button class="btn btn-pink" onclick="adoptAnimal()">領養</button>
        </div>`;
      }

      updateCdUI();
      updateWorldMap();
      renderHeartBar();

      document.getElementById('logsList').innerHTML = state.logs.map(l => {
        const who = l.actorId === 'player_1' ? 'Terence' : (l.actorId === 'player_2' ? 'Namwan' : '系統');
        return `<li><strong>[${who}]</strong> ${l.message}</li>`;
      }).join('');
    }

    state.users.forEach(normalizeUser);
    ensurePlots();
    syncLevelDerived();
    state.animals.forEach(an => { if (!state.codex.animals[an.species]) state.codex.animals[an.species] = 1; });
    buildWorldMap();
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
    document.documentElement.lang = lang === 'zh' ? 'zh-Hant' : lang;
    if (lang !== 'zh') document.title = lang === 'en' ? 'Couple 2.5D Farm Adventure' : 'ฟาร์มผจญภัย 2.5D ของคู่รัก';
    document.getElementById('idBtn' + (actor === 'player_2' ? 2 : 1)).classList.add('last');
    switchActor(actor);
    if (!LOC_META[currentLoc]) currentLoc = 'farm';
    document.getElementById('currentLocLabel').textContent = LOC_META[currentLoc].label;
    render();
    translateDom(document.body);
    function chooseActor(id) {
      switchActor(id);
      document.getElementById('idModal').classList.remove('show');
      startGame();
    }
    function startGame() {
      started = true;
      goLocation(currentLoc, true);
      setInterval(() => {
        if (!uiBusy() && !busyGame && currentLoc === 'farm' && state.plots.some(p => p.status === 'growing')) render();
        else renderHud();
        updateCdUI();
      }, 1000);
      setInterval(() => {
        syncWithUploadFirst(false).then(() => { if (!gTimer && !uiBusy() && !busyGame && !modalFn) render(); else if (modalFn) refreshModal(); });
      }, 12000);
      syncWithUploadFirst(false).then(() => render());
    }
  </script>
</body>
</html>
