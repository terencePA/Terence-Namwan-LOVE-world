<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>雙人情侶 2.5D 莊園大冒險</title>
  <style>
    :root {
      --bg: #f6f8ff;
      --card: #ffffff;
      --primary: #ff5d94;
      --primary-dark: #d83f74;
      --secondary: #6c5ce7;
      --green: #2ecc71;
      --gold: #f59f00;
      --text: #2d2430;
      --muted: #6f6275;
      --border: #ead9e4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
      background: radial-gradient(circle at top, #fff2f7 0%, #eef3ff 62%, #e6f7ef 100%);
      color: var(--text);
      padding-bottom: 56px;
      overflow-x: hidden;
    }
    header {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      border-bottom: 2px solid var(--border);
      padding: 10px 16px;
      position: sticky;
      top: 0;
      z-index: 30;
    }
    .top-row {
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .brand { font-weight: 900; font-size: 1.15rem; color: var(--primary-dark); }
    .acc-group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .acc-btn {
      border: 2px solid var(--border);
      background: #fff;
      padding: 5px 12px;
      border-radius: 999px;
      font-weight: 700;
      cursor: pointer;
    }
    .acc-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .hud {
      max-width: 1120px;
      margin: 8px auto 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
      gap: 8px;
    }
    .hud-box {
      background: #fff4f8;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 6px 12px;
      font-size: 0.88rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .container { max-width: 1120px; margin: 14px auto; padding: 0 14px; }

    /* 2.5D 世界地圖 */
    .world-map-card {
      background: linear-gradient(160deg, #dff6ff 0%, #e7f9e5 55%, #fff5d6 100%);
      border: 2px solid #cbe3d5;
      border-radius: 22px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 12px 28px rgba(70, 95, 120, 0.12);
    }
    .map-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .map-stage {
      perspective: 900px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      padding: 6px 2px 10px;
    }
    .loc-node {
      transform: rotateX(14deg);
      transform-style: preserve-3d;
      border-radius: 18px;
      padding: 12px 10px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      border: 2px solid rgba(255, 255, 255, 0.85);
      color: #242029;
    }
    .loc-node:hover { transform: rotateX(6deg) translateY(-5px); }
    .loc-node.selected {
      outline: 3px solid var(--primary);
      box-shadow: 0 14px 24px rgba(255, 93, 148, 0.32), 0 6px 0 rgba(0, 0, 0, 0.12);
    }
    .loc-node:not(.selected) { box-shadow: 0 6px 0 rgba(0, 0, 0, 0.12); }
    .loc-farm     { background: linear-gradient(180deg, #b8f29c, #7ed957); }
    .loc-animals  { background: linear-gradient(180deg, #ffe599, #f7c948); }
    .loc-shop     { background: linear-gradient(180deg, #ffd1e6, #ff9ec7); }
    .loc-plaza    { background: linear-gradient(180deg, #e3dcff, #b8a9ff); }
    .loc-beach    { background: linear-gradient(180deg, #b5f2ff, #6ad7f0); }
    .loc-mountain { background: linear-gradient(180deg, #e5e9f0, #b8c2d1); }
    .loc-forest   { background: linear-gradient(180deg, #9be7b0, #46b86a); }
    .loc-icon { font-size: 2rem; line-height: 1.15; }
    .loc-name { font-weight: 800; font-size: 0.95rem; margin-top: 4px; }
    .loc-sub  { font-size: 0.74rem; opacity: 0.85; }

    /* 場景面板 */
    .scene-panel {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 22px;
      padding: 18px;
      box-shadow: 0 10px 26px rgba(45, 36, 48, 0.06);
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
    }
    .scene-banner {
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 14px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      transform: perspective(700px) rotateX(6deg);
      box-shadow: 0 6px 0 rgba(0, 0, 0, 0.08);
    }
    .banner-farm     { background: linear-gradient(90deg, #dff7c8, #b6eb8c); }
    .banner-animals  { background: linear-gradient(90deg, #fff0bd, #ffd86b); }
    .banner-shop     { background: linear-gradient(90deg, #ffe3f0, #ffc2dd); }
    .banner-plaza    { background: linear-gradient(90deg, #ece8ff, #d1c7ff); }
    .banner-beach    { background: linear-gradient(90deg, #d6f7ff, #9ce9fc); }
    .banner-mountain { background: linear-gradient(90deg, #eef2f7, #d2dae6); }
    .banner-forest   { background: linear-gradient(90deg, #d7f7e0, #9be5b0); }

    /* 布置展示條 */
    .decor-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
      min-height: 34px;
      align-items: center;
    }
    .decor-badge {
      background: #fff8fb;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.82rem;
      font-weight: 700;
      animation: floatGentle 2.6s ease-in-out infinite;
    }

    /* 農場 2.5D 田壟與特效 */
    .plots-25d {
      perspective: 800px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(142px, 1fr));
      gap: 12px;
    }
    .tile-25d {
      transform: rotateX(15deg);
      border-radius: 15px;
      padding: 10px;
      min-height: 128px;
      background: linear-gradient(180deg, #f7dfb9, #e6be86);
      border: 2px solid #cfa063;
      box-shadow: 0 6px 0 #b38347;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-align: center;
      position: relative;
      transition: transform 0.2s;
    }
    .tile-25d.ripe {
      background: linear-gradient(180deg, #dffbe6, #a8ecc0);
      border-color: #54c47d;
      box-shadow: 0 6px 0 #3a9c5e;
      animation: ripePulse 1.4s ease-in-out infinite;
    }
    .tile-25d.locked {
      background: linear-gradient(180deg, #e6eaee, #cfd6dd);
      border-color: #b4bec8;
      box-shadow: 0 6px 0 #9aa5b1;
      opacity: 0.75;
    }
    .crop-sway {
      display: inline-block;
      font-size: 1.95rem;
      animation: sway 2.2s ease-in-out infinite;
    }
    .fx-pop {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--primary-dark);
      pointer-events: none;
      animation: fxRise 0.9s ease-out forwards;
      white-space: nowrap;
      z-index: 10;
    }

    /* 牧場動物特效 */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(245px, 1fr));
      gap: 14px;
    }
    .card-box {
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 13px;
      background: #fffdfe;
      box-shadow: 0 4px 0 rgba(216, 63, 116, 0.07);
      position: relative;
    }
    .animal-avatar {
      display: inline-block;
      font-size: 2rem;
      animation: hop 2s ease-in-out infinite;
      cursor: pointer;
    }
    .progress {
      height: 10px;
      background: #f2e6ee;
      border-radius: 999px;
      overflow: hidden;
      margin: 7px 0;
    }
    .progress > div {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      transition: width .25s;
    }

    /* 海邊海浪動態 */
    .ocean-stage {
      position: relative;
      height: 210px;
      border-radius: 18px;
      background: linear-gradient(180deg, #7be0ff 0%, #38bdf8 55%, #f6e2a6 56%, #ebd088 100%);
      overflow: hidden;
      border: 2px solid #7dd3fc;
      margin-bottom: 12px;
    }
    .wave-layer {
      position: absolute;
      left: -10%;
      width: 120%;
      height: 44px;
      top: 46%;
      background: rgba(255, 255, 255, 0.52);
      border-radius: 45%;
      animation: waveMove 3.4s ease-in-out infinite;
    }
    .wave-layer.w2 {
      top: 50%;
      height: 36px;
      background: rgba(255, 255, 255, 0.34);
      animation: waveMove 4.6s ease-in-out reverse infinite;
    }
    .shell-item {
      position: absolute;
      bottom: 18px;
      font-size: 1.7rem;
      cursor: pointer;
      animation: floatGentle 2.2s ease-in-out infinite;
    }

    /* 山上山泉與祈願樹動態 */
    .mountain-stage {
      position: relative;
      height: 230px;
      border-radius: 18px;
      background: linear-gradient(180deg, #cbe8ff 0%, #eaf6ff 58%, #cdeac0 59%, #9fd88b 100%);
      overflow: hidden;
      border: 2px solid #bae6fd;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 12px;
    }
    .spring-box {
      background: rgba(255, 255, 255, 0.72);
      border-radius: 16px;
      padding: 12px 16px;
      text-align: center;
      border: 1px solid #93c5fd;
    }
    .stream-flow {
      font-size: 1.6rem;
      animation: streamDrop 1.2s linear infinite;
    }
    .wish-tree-box {
      background: rgba(255, 250, 240, 0.82);
      border-radius: 16px;
      padding: 12px 16px;
      text-align: center;
      border: 1px solid #fcd34d;
      max-width: 310px;
    }
    .wish-icon {
      font-size: 2.3rem;
      display: inline-block;
      animation: sway 2.8s ease-in-out infinite;
    }
    .wish-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      justify-content: center;
      margin-top: 6px;
      max-height: 54px;
      overflow-y: auto;
    }
    .wish-chip {
      background: #ffe4ec;
      color: #b52b5c;
      font-size: 0.74rem;
      padding: 2px 7px;
      border-radius: 999px;
      font-weight: 700;
    }

    /* 森林動態與抓蟲小遊戲 */
    .forest-canopy {
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: linear-gradient(180deg, #dcfce7, #bbf7d0);
      border: 1px solid #86efac;
      border-radius: 14px;
      padding: 8px 12px;
      margin-bottom: 10px;
      font-size: 1.3rem;
    }
    .tree-sway { display: inline-block; animation: sway 3s ease-in-out infinite; }
    .arena {
      position: relative;
      height: 230px;
      border-radius: 16px;
      background: linear-gradient(180deg, #c7f2d4, #9ae3b2);
      border: 2px solid #5bc77e;
      overflow: hidden;
      user-select: none;
    }
    .bug {
      position: absolute;
      font-size: 2rem;
      cursor: pointer;
      transform: translate(-50%, -50%);
      animation: hop 0.9s ease-in-out infinite;
    }

    .btn {
      border: none;
      border-radius: 9px;
      padding: 6px 10px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.82rem;
    }
    .btn-pink { background: var(--primary); color: #fff; }
    .btn-purple { background: var(--secondary); color: #fff; }
    .btn-green { background: var(--green); color: #fff; }
    .btn-gold { background: var(--gold); color: #fff; }
    .btn-light { background: #f2ecf2; color: var(--text); }

    .logs { list-style: none; margin: 0; padding: 0; font-size: 0.85rem; }
    .logs li { padding: 6px 0; border-bottom: 1px dashed #f0dce7; color: var(--muted); }
    select, input[type="text"] {
      padding: 5px 8px;
      border-radius: 8px;
      border: 1px solid #d8c6d2;
    }

    #toast { position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%) translateY(20px); background: #2d2430; color: #fff; padding: 8px 18px; border-radius: 999px; opacity: 0; transition: .25s; z-index: 99; pointer-events: none; font-size: .88rem; }
    #toast.show { opacity: 1; transform: translateX(-50%); }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .shell-item.on-cd { opacity: .3; filter: grayscale(1); }
    .slot-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .slot { width: 54px; height: 54px; border: 2px dashed #e3b7cd; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #cf9ab5; font-size: 1.3rem; background: #fff8fb; }
    .smoke { animation: floatGentle 2s ease-in-out infinite; }
    .wm-scroll { overflow-x: auto; padding-bottom: 4px; }
    .wm { position: relative; width: 100%; min-width: 560px; max-width: 820px; margin: 0 auto; aspect-ratio: 16 / 10; border-radius: 18px; overflow: hidden; border: 2px solid #8ecfa8; box-shadow: 0 8px 20px rgba(60,100,80,.18); }
    .wm-bg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .wm-node { position: absolute; transform: translate(-50%, -50%); text-align: center; cursor: pointer; transition: transform .2s; z-index: 2; }
    .wm-node:hover { transform: translate(-50%, -56%); }
    .wm-badge { width: 58px; height: 58px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.9rem; border: 3px solid #fff; box-shadow: 0 5px 0 rgba(0,0,0,.18); margin: 0 auto; }
    .wm-label { margin-top: 5px; background: rgba(255,255,255,.93); border-radius: 999px; padding: 1px 9px; font-size: .78rem; font-weight: 800; white-space: nowrap; box-shadow: 0 2px 0 rgba(0,0,0,.1); }
    .wm-node.selected .wm-badge { outline: 4px solid var(--primary); animation: hop 1.4s ease-in-out infinite; }
    .wm-node.locked { filter: grayscale(.9); opacity: .85; }
    .wm-pin { position: absolute; z-index: 4; font-size: 1.7rem; transition: left .7s ease, top .7s ease; transform: translate(16px, -48px); pointer-events: none; filter: drop-shadow(0 3px 2px rgba(0,0,0,.3)); }
    .wm-compass { position: absolute; top: 6px; left: 50%; transform: translateX(-50%); z-index: 3; background: rgba(255,255,255,.8); border-radius: 999px; padding: 1px 10px; font-size: .75rem; font-weight: 800; }
    .wm-cloud { animation: floatGentle 5s ease-in-out infinite; }
    .town-b:hover { filter: brightness(1.07); }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes sway {
      0%, 100% { transform: rotate(-4deg); }
      50% { transform: rotate(4deg); }
    }
    @keyframes hop {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    @keyframes floatGentle {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    @keyframes ripePulse {
      0%, 100% { transform: rotateX(15deg) scale(1); }
      50% { transform: rotateX(15deg) scale(1.03); }
    }
    @keyframes waveMove {
      0%, 100% { transform: translateX(-3%) rotate(-1deg); }
      50% { transform: translateX(3%) rotate(1deg); }
    }
    @keyframes streamDrop {
      0% { transform: translateY(-4px); opacity: 0.6; }
      50% { opacity: 1; }
      100% { transform: translateY(6px); opacity: 0.6; }
    }
    @keyframes fxRise {
      0% { opacity: 1; transform: translate(-50%, 0); }
      100% { opacity: 0; transform: translate(-50%, -26px); }
    }
  </style>
</head>
<body>
  <header>
    <div class="top-row">
      <div class="brand">🗺️ Terence &amp; Namwan 2.5D 情侶世界 <span id="syncStatus" style="font-size:0.78rem;color:#7a6c7a;">（準備同步）</span></div>
      <div class="acc-group">
        <button class="acc-btn" id="syncNowBtn" onclick="syncWithUploadFirst()">🔄 先傳後載同步</button>
        <button class="acc-btn" id="soundBtn" onclick="toggleSound()">🔊 音效開</button>
        <span>身分：</span>
        <button class="acc-btn active" id="btnP1" onclick="switchActor('player_1')">🧑 Terence</button>
        <button class="acc-btn" id="btnP2" onclick="switchActor('player_2')">👩 Namwan</button>
      </div>
    </div>
    <div class="hud" id="hud"></div>
  </header>

  <div class="container">
    <!-- 2.5D 世界地圖 -->
    <section class="world-map-card">
      <div class="map-header">
        <strong>🧭 莊園世界地圖（點擊地點前往，小人會走過去）</strong>
        <span style="font-size:0.84rem;color:#4f6356;">目前位置：<strong id="currentLocLabel">🌱 農場</strong></span>
      </div>
      <div class="wm-scroll"><div class="wm" id="worldMap"></div></div>
    </section>

    <!-- 場景內容區 -->
    <section class="scene-panel" id="scenePanel"></section>

    <!-- 雙人互動紀錄 -->
    <section class="scene-panel">
      <strong>💞 雙人互動動態紀錄</strong>
      <ul class="logs" id="logsList" style="margin-top:8px;"></ul>
    </section>
  </div>

  <script>
    const DEFAULT_GAS_DEPLOYMENT_ID = 'AKfycbze8ojygzzO_Z0XfsWaS4wbrzXZPzbgLyHmhRQaf42kGsvQy5WiRh2qzQv9H-HWZ30v1w';
    const gasUrl = `https://script.google.com/macros/s/${DEFAULT_GAS_DEPLOYMENT_ID}/exec`;

    /* Web Audio 即時音效合成器 */
    const SoundFX = (() => {
      let ctx = null;
      let enabled = localStorage.getItem('couple_25d_sound') !== 'off';

      function ensureCtx() {
        if (!ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) ctx = new AC();
        }
        if (ctx && ctx.state === 'suspended') {
          ctx.resume().catch(() => {});
        }
        return ctx;
      }

      function tone(freq, type, dur, vol = 0.08, delay = 0, endFreq = null) {
        if (!enabled) return;
        const ac = ensureCtx();
        if (!ac) return;
        const now = ac.currentTime + delay;
        const osc = ac.createOscillator();
        const gain = ac.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, now + dur);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.linearRampToValueAtTime(vol, now + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
        osc.connect(gain);
        gain.connect(ac.destination);
        osc.start(now);
        osc.stop(now + dur + 0.02);
      }

      return {
        toggle() {
          enabled = !enabled;
          localStorage.setItem('couple_25d_sound', enabled ? 'on' : 'off');
          return enabled;
        },
        isEnabled() { return enabled; },
        step() { tone(320, 'triangle', 0.07, 0.05, 0, 440); },
        plant() { tone(260, 'sine', 0.14, 0.08, 0, 520); },
        water() {
          tone(580, 'sine', 0.12, 0.07, 0, 880);
          tone(660, 'sine', 0.14, 0.07, 0.08, 990);
        },
        harvest() {
          tone(523.25, 'triangle', 0.12, 0.09, 0);
          tone(659.25, 'triangle', 0.12, 0.09, 0.09);
          tone(783.99, 'triangle', 0.18, 0.1, 0.18);
        },
        animal() {
          tone(440, 'sine', 0.11, 0.08, 0, 620);
          tone(587.33, 'sine', 0.14, 0.08, 0.1, 740);
        },
        coin() {
          tone(987.77, 'sine', 0.1, 0.08, 0);
          tone(1318.51, 'sine', 0.18, 0.08, 0.08);
        },
        wave() {
          tone(170, 'sine', 0.45, 0.08, 0, 110);
          tone(130, 'triangle', 0.5, 0.06, 0.2, 95);
        },
        bird() {
          tone(1760, 'sine', 0.09, 0.06, 0, 2349);
          tone(2093, 'sine', 0.11, 0.06, 0.11, 1661);
          tone(2349, 'sine', 0.12, 0.06, 0.24, 2637);
        },
        spring() {
          tone(620, 'sine', 0.16, 0.07, 0, 920);
          tone(740, 'sine', 0.2, 0.06, 0.12, 1080);
        },
        wish() {
          tone(783.99, 'sine', 0.22, 0.07, 0);
          tone(1046.5, 'sine', 0.26, 0.07, 0.14);
          tone(1318.51, 'sine', 0.35, 0.08, 0.28);
        }
      };
    })();

    document.addEventListener('pointerdown', () => {
      if (SoundFX.isEnabled()) SoundFX.step();
    }, { once: true });

    function toggleSound() {
      const on = SoundFX.toggle();
      document.getElementById('soundBtn').textContent = on ? '🔊 音效開' : '🔇 音效靜音';
      if (on) SoundFX.coin();
    }

    const LOC_META = {

    function addExp(exp, msg) {
      state.couple.loveExp += exp;
      const old = state.couple.loveLevel || 1;
      const lv = levelFromExp(state.couple.loveExp);
      if (lv > old) {
        state.couple.loveLevel = lv;
        state.couple.unlockedPlots = Math.max(state.couple.unlockedPlots || 6, plotsForLevel(lv));
        const un = [];
        for (let L = old + 1; L <= lv && un.length < 8; L++) (getUnlocks()[L] || []).forEach(t => un.push(t));
        pushLog(`🎉 愛情升級至 Lv.${lv}！` + (un.length ? `解鎖：${un.slice(0, 8).join('、')}` : '繼續加油！'));
        toast(`🎉 愛情等級 Lv.${lv}！` + (un.length ? ` 解鎖 ${un[0]}${un.length > 1 ? ' 等' : ''}` : ''));
      }
      pushLog(`${msg}（+${exp} 愛心 EXP）`);
    }

    function spawnTileFx(plotId, text) {
      const tile = document.querySelector(`[data-plot="${plotId}"]`);
      if (!tile) return;
      const fx = document.createElement('div');
      fx.className = 'fx-pop';
      fx.textContent = text;
      tile.appendChild(fx);
      setTimeout(() => fx.remove(), 920);
    }

    function mergeServerState(data) {
      if (!data || typeof data !== 'object') return false;
      if (Array.isArray(data.users) && data.users.length) {
        const old = state.users;
        state.users = data.users.map(su => {
          const lo = old.find(o => o.accountId === su.accountId) || {};
          return normalizeUser({ stamina: lo.stamina, staminaAt: lo.staminaAt, bonus: lo.bonus, cd: lo.cd, ...su });
        });
      }
      if (Array.isArray(data.cottageDecor)) state.cottageDecor = data.cottageDecor;
      if (data.couple && typeof data.couple === 'object') state.couple = { ...state.couple, ...data.couple };
      if (Array.isArray(data.plots) && data.plots.length) state.plots = data.plots;
      ensurePlots();
      if (Array.isArray(data.animals)) state.animals = data.animals;
      if (Array.isArray(data.buildings) && data.buildings.length) {
        state.buildings = data.buildings.map(b => ({ level: 1, ...b }));
        ensureCottage();
      }
      if (Array.isArray(data.decorations) && data.decorations.length) state.decorations = data.decorations;
      if (Array.isArray(data.wishes) && data.wishes.length) state.wishes = data.wishes;
      if (Array.isArray(data.logs) && data.logs.length) state.logs = data.logs;
      syncLevelDerived();
      return true;
    }

    /* 第一步：先將本機資料上傳至 GAS */
    async function uploadLocalState() {
      try {
        await fetch(gasUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'uploadState',
            actor,
            state
          })
        });
      } catch (err) {
        // 若遇到重新導向或網路限制，改以 GET 參數嘗試上傳
        try {
          const fallbackUrl = new URL(gasUrl);
          fallbackUrl.searchParams.set('action', 'uploadState');
          fallbackUrl.searchParams.set('actor', actor);
          fallbackUrl.searchParams.set('payload', JSON.stringify(state));
          fallbackUrl.searchParams.set('_t', Date.now());
          await fetch(fallbackUrl.toString(), { cache: 'no-store' });
        } catch (_) {}
      }
    }

    /* 第二步：向 GAS 下載最新狀態 */
    async function downloadRemoteState() {
      const url = new URL(gasUrl);
      url.searchParams.set('action', 'getState');
      url.searchParams.set('actor', actor);
      url.searchParams.set('_t', Date.now());
      const res = await fetch(url.toString(), { cache: 'no-store' });
      const data = await res.json();
      if (mergeServerState(data)) {
        const t = new Date().toTimeString().slice(0, 8);
        document.getElementById('syncStatus').textContent = `（已傳載同步 ${t}）`;
      } else {
        document.getElementById('syncStatus').textContent = '（本機體驗）';
      }
      return data;
    }

    /* 完整流程：先上傳本機資料 -> 再下載最新資料 */
    async function syncWithUploadFirst(shouldUpload = true) {
      if (isSyncing) return null;
      isSyncing = true;
      document.getElementById('syncStatus').textContent = shouldUpload ? '（上傳本機中...）' : '（下載同步中...）';
      try {
        if (shouldUpload) {
          await uploadLocalState();
          document.getElementById('syncStatus').textContent = '（下載最新中...）';
        }
        return await downloadRemoteState();
      } catch (err) {
        document.getElementById('syncStatus').textContent = '（本機體驗）';
        return null;
      } finally {
        isSyncing = false;
      }
    }

    /* 農場動作 */
    async function plantPlot(plotId) {
      const sel = document.getElementById('seedSel');
      const cfg = CROPS[sel ? sel.value : 'carrot'];
      const u = curUser();
      if (u.coins < cfg.cost) return alert('金幣不足！');
      SoundFX.plant();
      u.coins -= cfg.cost;
      const p = state.plots.find(x => x.plotId === plotId);
      p.cropType = sel.value;
      p.plantTime = Date.now();
      p.waterCount = 0;
      p.status = 'growing';
      addExp(10, `${u.nickname} 在 ${plotId} 種下了 ${cfg.icon}${cfg.name}`);
      render();
      spawnTileFx(plotId, `${cfg.icon} 播種！`);
      await syncWithUploadFirst(true);
      render();
    }

    async function waterPlot(plotId) {
      const u = curUser();
      SoundFX.water();
      const p = state.plots.find(x => x.plotId === plotId);
      p.waterCount += 1;
      if (p.plantTime) p.plantTime -= 3000;
      const isPartner = p.ownerId !== actor;
      addExp(isPartner ? 25 : 10, isPartner ? `${u.nickname} 幫另一半的 ${plotId} 澆水！` : `${u.nickname} 為 ${plotId} 澆水`);
      render();
      spawnTileFx(plotId, '💧 澆水成長！');
      await syncWithUploadFirst(true);
      render();
    }

    async function harvestPlot(plotId) {
      const u = curUser();
      SoundFX.harvest();
      const p = state.plots.find(x => x.plotId === plotId);
      const cfg = CROPS[p.cropType] || CROPS.carrot;
      u.coins += cfg.sell;
      p.cropType = ''; p.plantTime = ''; p.waterCount = 0; p.status = 'empty';
      addExp(cfg.exp, `${u.nickname} 收成 ${cfg.icon}${cfg.name}（+${cfg.sell} 金幣）`);
      render();
      spawnTileFx(plotId, `+${cfg.sell} 💰`);
      await syncWithUploadFirst(true);
      render();
    }

    /* 牧場動作 */
    async function adoptAnimal() {
      const sp = document.getElementById('aniSel').value;
      const name = document.getElementById('petName').value.trim() || '小甜心';
      const cfg = ANIMALS[sp];
      const u = curUser();
      if (u.coins < cfg.price) return alert('金幣不足！');
      SoundFX.animal();
      u.coins -= cfg.price;
      state.animals.push({ uid: 'ANI_' + Date.now(), species: sp, petName: name, hunger: 100, affection: 25, readyProduce: 0 });
      addExp(40, `${u.nickname} 領養了 ${cfg.icon}「${name}」`);
      document.getElementById('petName').value = '';
      petDraft = '';
      render();
      await syncWithUploadFirst(true);
      render();
    }

    async function interactAnimal(uid, mode) {
      const u = curUser();
      SoundFX.animal();
      const a = state.animals.find(x => x.uid === uid);
      const cfg = ANIMALS[a.species];
      if (mode === 'feed') {
        if (state.couple.feed <= 0) return alert('飼料不足，請先到商店購買！');
        state.couple.feed -= 1;
        a.hunger = Math.min(100, a.hunger + 30);
        a.affection = Math.min(100, a.affection + 10);
        a.readyProduce = 1;
        addExp(15, `${u.nickname} 餵食了「${a.petName}」`);
      } else if (mode === 'pet') {
        a.affection = Math.min(100, a.affection + 15);
        addExp(20, `${u.nickname} 撫摸了「${a.petName}」💖`);
      } else if (mode === 'collect' && a.readyProduce) {
        u.coins += cfg.sell;
        a.readyProduce = 0;
        addExp(cfg.exp, `${u.nickname} 收集「${a.petName}」的${cfg.prod}（+${cfg.sell} 金幣）`);
      }
      render();
      await syncWithUploadFirst(true);
      render();
    }

    /* 商店與布置 */
    async function buyShop(itemType, qty) {
      const u = curUser();
      const cost = (itemType === 'wood' ? 50 : itemType === 'feed' ? 25 : 100) * qty;
      if (u.coins < cost) return alert('金幣不足！');
      SoundFX.coin();
      u.coins -= cost;
      if (itemType === 'wood') { state.couple.wood += qty; addExp(10 * qty, `${u.nickname} 購買了 ${qty} 木材`); }
      else if (itemType === 'feed') { state.couple.feed += qty; addExp(10 * qty, `${u.nickname} 購買了 ${qty} 飼料`); }
      else {
        const p = state.users.find(x => x.accountId !== actor);
        if (p) p.coins += qty * 100;
        addExp(35 * qty, `${u.nickname} 送給 ${p ? p.nickname : '另一半'} ${qty * 100} 金幣`);
      }
      render();
      await syncWithUploadFirst(true);
      render();
    }

    async function buyDecor(decId) {
      const item = DECOR_CATALOG.find(d => d.id === decId);
      if (!item) return;
      if (state.decorations.includes(decId)) return alert('已經擁有這個布置囉！');
      if ((state.couple.loveLevel || 1) < (item.lv || 1)) return toast(`🔒 需要愛情等級 Lv.${item.lv}`);
      const u = curUser();
      if (u.coins < item.price) return alert('金幣不足！');
      SoundFX.coin();
      u.coins -= item.price;
      state.decorations.push(decId);
      addExp(25, `${u.nickname} 購入布置「${item.name}」`);
      render();
      await syncWithUploadFirst(true);
      render();
    }

    /* 10 級建築升等 */
    async function investBld(bldId) {
      const u = curUser();
      const b = state.buildings.find(x => x.id === bldId);
      if (!b) return;
      const curLv = b.level || 1;
      if (curLv >= 10) return alert('這座建築已達最高 Lv.10 夢幻型態！');
      if ((state.couple.loveLevel || 1) < curLv * 2) return toast(`🔒 需要愛情等級 Lv.${curLv * 2} 才能升級`);

      const wAdd = Math.min(2, state.couple.wood, b.woodNeed - b.woodDonated);
      const cAdd = Math.min(150, u.coins, b.coinsNeed - b.coinsDonated);
      if (wAdd === 0 && cAdd === 0) return alert('沒有可投入的木材或金幣！');

      SoundFX.harvest();
      state.couple.wood -= wAdd;
      u.coins -= cAdd;
      b.woodDonated += wAdd;
      b.coinsDonated += cAdd;
      if (b.woodDonated >= b.woodNeed && b.coinsDonated >= b.coinsNeed) {
        b.level = Math.min(10, curLv + 1);
        b.woodDonated = 0;
        b.coinsDonated = 0;
        b.woodNeed = Math.round(b.woodNeed * 1.25);
        b.coinsNeed = Math.round(b.coinsNeed * 1.25);
        b.status = b.level >= 10 ? 'max_level' : 'building';
        addExp(120, `🏰「${b.name}」升至 Lv.${b.level}，外觀全面升級！`);
      } else {
        addExp(wAdd * 15 + Math.floor(cAdd / 20), `${u.nickname} 投入建材建造「${b.name}」`);
      }
      render();
      await syncWithUploadFirst(true);
      render();
    }

      s += `<polygon points="${x0 - 8},68 110,${lv >= 7 ? 40 : 34} ${x1 + 8},68" fill="${roof}" stroke="${S}" stroke-width="2.2" ${lv >= 7 ? 'opacity=".96"' : ''}/>`;

      if (lv >= 3) { let f = ''; for (let x = 24; x <= 190; x += 11) { if (x > 96 && x < 124) continue; f += `<rect x="${x}" y="112" width="4" height="12" fill="#fff" stroke="${S}" stroke-width="1"/>`; } s += f + `<line x1="24" y1="118" x2="94" y2="118" stroke="${S}" stroke-width="1.2"/><line x1="126" y1="118" x2="192" y2="118" stroke="${S}" stroke-width="1.2"/><text x="196" y="116" font-size="11">📮</text>`; }

          ${hasStars ? `<text x="34" y="34" font-size="14">✨</text><text x="172" y="34" font-size="14">✨</text>` : ''}

    /* 海邊 / 山上 / 森林 探索 */
    async function exploreSpot(spot) {
      if (!checkSpot(spot)) return;
      const u = curUser();
      const cost = SPOTS[spot].stamina;
      if (spot === 'beach') {
        SoundFX.wave();
        SoundFX.coin();
        u.coins += 65;
        addExp(25, `${u.nickname} 在海邊聽海浪撿到貝殼（+65 金幣，-${cost} 體力）`);
      } else if (spot === 'mountain') {
        SoundFX.spring();
        u.coins += 80;
        addExp(35, `${u.nickname} 在山上採集山泉水（+80 金幣，-${cost} 體力）`);
      } else if (spot === 'forest') {
        SoundFX.bird();
        state.couple.wood += 2;
        addExp(20, `${u.nickname} 在森林聽鳥叫砍伐了 2 單位木材（-${cost} 體力）`);
      }
      render();
      await syncWithUploadFirst(true);
      render();
    }

    async function addWish() {
      const inp = document.getElementById('wishInput');
      const txt = inp ? inp.value.trim() : '';
      if (!txt) return;
      SoundFX.wish();
      const u = curUser();
      state.wishes.unshift(`${txt}（${u.nickname}）`);
      state.wishes = state.wishes.slice(0, 8);
      addExp(30, `${u.nickname} 在祈願樹掛上願望：「${txt}」`);
      inp.value = '';
      render();
      await syncWithUploadFirst(true);
      render();
    }

    /* 森林小遊戲：抓蟲大作戰 */
    let gTimer = null, sTimer = null, gScore = 0, gLeft = 0;
    function startBugGame() {
      if (gTimer) return;
      if (!checkSpot('bug')) return;
      SoundFX.bird();
      const arena = document.getElementById('arena');
      arena.innerHTML = '';
      gScore = 0; gLeft = 15;
      document.getElementById('gScore').textContent = gScore;
      document.getElementById('gLeft').textContent = gLeft;
      updateCdUI();

      sTimer = setInterval(() => {
        const el = document.createElement('div');
        el.className = 'bug';
        el.textContent = Math.random() > 0.35 ? '🪲' : '🐦';
        el.style.left = (12 + Math.random() * 76) + '%';
        el.style.top = (15 + Math.random() * 70) + '%';
        el.onclick = () => {
          SoundFX.coin();
          gScore += 1;
          document.getElementById('gScore').textContent = gScore;
          el.remove();
        };
        arena.appendChild(el);
        setTimeout(() => el.remove(), 1400);
      }, 550);

      gTimer = setInterval(async () => {
        gLeft -= 1;
        document.getElementById('gLeft').textContent = gLeft;
        if (gLeft <= 0) {
          clearInterval(gTimer); clearInterval(sTimer);
          gTimer = null; sTimer = null;
          arena.innerHTML = '';
          const u = curUser();
          SoundFX.harvest();
          u.coins += gScore * 5;
          addExp(gScore * 4, `${u.nickname} 森林抓蟲獲得 ${gScore} 分（+${gScore * 5} 金幣）`);
          render();
          await syncWithUploadFirst(true);
          render();
          alert(`抓蟲結束！得分 ${gScore} 分！`);
        }
      }, 1000);
    }

      let list = DECOR_CATALOG.slice();

      else if (decorFilter === 'unowned') list = list.filter(d => !state.decorations.includes(d.id));
      else if (decorFilter !== 'all') list = list.filter(d => d.area === decorFilter);
      return list.sort((a, b) => a.price - b.price);

      const tabs = [['all','全部'],['farm','🌱 農場'],['animals','🐾 牧場'],['building','🏛️ 建築'],['unowned','未擁有'],['owned','已擁有']];

      return `<div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px;">` + tabs.map(([k, l]) =>

        `<span style="font-size:0.8rem;color:var(--muted);">收藏 ${own} / ${DECOR_CATALOG.length}</span></div>`;

      } else if (currentLoc === 'mountain') {
        bodyHtml += `
          <div class="mountain-stage">
            <div class="spring-box">
              <div style="font-size:1.7rem;">⛰️💧</div>
              <div class="stream-flow">💦 🌊 💦</div>
              <div style="font-size:0.82rem;font-weight:700;">高山清澈山泉</div>
              <div style="display:flex;gap:6px;justify-content:center;margin-top:8px;">
                <button class="btn btn-purple" data-spot="mountain" onclick="exploreSpot('mountain')">採山泉</button>
                <button class="btn btn-light" onclick="SoundFX.spring()">🔊 山泉聲</button>
              </div>
            </div>
            <div class="wish-tree-box">
              <div class="wish-icon">🎋🌳</div>
              <div style="font-size:0.84rem;font-weight:800;">雙人愛情祈願樹</div>
              <div style="display:flex;gap:4px;margin-top:6px;">
                <input type="text" id="wishInput" placeholder="寫下心願..." style="flex:1;min-width:90px;" />
                <button class="btn btn-pink" onclick="addWish()">許願</button>
              </div>
              <div class="wish-tags">` + state.wishes.map(w => `<span class="wish-chip">🎀 ${w}</span>`).join('') + `</div>
            </div>
          </div>
        `;
      } else if (currentLoc === 'forest') {
        bodyHtml += `
          <div class="forest-canopy">
            <span class="tree-sway">🌲</span>
            <span class="tree-sway" style="animation-delay:.4s;">🐦</span>
            <span class="tree-sway" style="animation-delay:.8s;">🌳</span>
            <span class="tree-sway" style="animation-delay:1.2s;">🦜</span>
            <span class="tree-sway" style="animation-delay:1.6s;">🌲</span>
          </div>
          <div style="margin-bottom:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;">
            <button class="btn btn-green" data-spot="forest" onclick="exploreSpot('forest')">伐木收集</button>
            <button class="btn btn-light" onclick="SoundFX.bird()">🐦 聽鳥叫</button>
            <button class="btn btn-pink" data-spot="bug" onclick="startBugGame()">開始抓蟲小遊戲（15s）</button>
            <span style="font-size:0.85rem;">得分：<strong id="gScore">0</strong> · 剩餘：<strong id="gLeft">15</strong>s</span>
          </div>
          <div class="arena" id="arena"></div>
        `;
      }

      document.getElementById('scenePanel').innerHTML = bodyHtml;

      const ctrl = document.getElementById('sceneControls');
      if (currentLoc === 'farm' && ctrl) {
        ctrl.innerHTML = `<select id="seedSel" onchange="selectedSeed=this.value">` + Object.entries(CROPS).map(([k, c]) => {
          const locked = lv < c.lv;
          return `<option value="${k}" ${locked ? 'disabled' : ''} ${selectedSeed === k ? 'selected' : ''}>${c.icon} ${c.name} (${c.cost}幣·Lv.${c.lv}${locked ? ' 🔒' : ''})</option>`;
        }).join('') + `</select>`;
      } else if (currentLoc === 'animals' && ctrl) {
        ctrl.innerHTML = `<div style="display:flex;gap:6px;flex-wrap:wrap;">
          <select id="aniSel" onchange="selectedAni=this.value">` + Object.entries(ANIMALS).map(([k, a]) => {
            const locked = lv < a.lv;
            return `<option value="${k}" ${locked ? 'disabled' : ''} ${selectedAni === k ? 'selected' : ''}>${a.icon} ${a.name} (${a.price}幣·Lv.${a.lv}${locked ? ' 🔒' : ''})</option>`;
          }).join('') + `</select>
          <input type="text" id="petName" placeholder="動物名字" style="width:110px;" value="${petDraft.replace(/\"/g, '&quot;')}" oninput="petDraft=this.value" />
          <button class="btn btn-pink" onclick="adoptAnimal()">領養</button>
        </div>`;
      }

      updateCdUI();
      updateWorldMap();

      document.getElementById('logsList').innerHTML = state.logs.map(l => {
        const who = l.actorId === 'player_1' ? 'Terence' : (l.actorId === 'player_2' ? 'Namwan' : '系統');
        return `<li><strong>[${who}]</strong> ${l.message}</li>`;
      }).join('');
    }

    state.users.forEach(normalizeUser);
    ensurePlots();
    syncLevelDerived();
    buildWorldMap();
    switchActor(actor);
    goLocation(LOC_META[currentLoc] ? currentLoc : 'farm', true);
    setInterval(() => {
      if (!uiBusy() && currentLoc === 'farm' && state.plots.some(p => p.status === 'growing')) render();
      else renderHud();
      updateCdUI();
    }, 1000);
    setInterval(() => {
      syncWithUploadFirst(true).then(() => { if (!gTimer && !uiBusy()) render(); });
    }, 12000);
    syncWithUploadFirst(false).then(() => render());
  </script>
</body>
</html>
